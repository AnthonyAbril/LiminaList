<div id="placa">
    <h1>{{this.listaSeleccionada?.name}}</h1>
</div>

<div class="contenedor">
  <div class="reloj-container">
    <app-reloj></app-reloj>
  </div>
  <div class="lista-container">
    <div class="scroll-interno">
      <app-lista [tareas]="this.tareas" [editar]="editar"></app-lista>
    </div>
  </div>
</div>
  
<div id="barra-tareas">
  <img src="assets\icons\dedo.png" [routerLink]="'/lists'" alt="Icono de Pluma" class="icono">
  <img src="assets\icons\cara.png" alt="Icono de Pluma" class="icono">
  <img src="assets\icons\clock.svg" alt="Icono de Pluma" class="icono">
  <img src="assets\icons\ajustes.svg" alt="Icono de Pluma" class="icono">
  <img src="assets\icons\calendar.svg" alt="Icono de Pluma" class="icono" [style]="'padding-bottom : 5px'">
  <img (click)="toggleEdicion()" src="assets\icons\square-pen-solid.svg" alt="Icono de Pluma" class="icono">
</div>

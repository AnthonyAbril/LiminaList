<div class="container-fluid">
  <div class="sidebar left-sidebar" [class.left-collapsed]="leftCollapsed">
    <div class="sidebar-header">
      <button class="toggle-btn" (click)="toggleLeft()">
        {{ leftCollapsed  ? '☰' : '×' }}
      </button>
      <h4 *ngIf="!leftCollapsed ">Filtros</h4>
    </div>
    
    <div class="sidebar-content" *ngIf="!leftCollapsed ">
      
      <input 
        type="text" 
        [(ngModel)]="filtro" 
        placeholder=" Filtrar listas..." 
        (input)="filtrarListas()" 
        class="search-bar"
      />
      
      <div class="filter-section">
        <h5>Categorías</h5>
        <div class="form-check">
          <input class="form-check-input" type="checkbox">
          <label class="form-check-label">Categoría 1</label>
        </div>
        <!-- Repetir para otras categorías -->
      </div>
    </div>
  </div>

  <div class="main-content">
    
    <div class="listas-container">
      <!-- Tu contenido existente aquí -->

      <h2>Listas</h2>
    
    
    <ul class="listas">
        <li *ngFor="let lista of listas" class="lista-item">
            
              <div class="lista-nombre">
                <h3>{{lista.name}}</h3>
              </div>
              
              <div class="opciones">
                <img src="assets/icons/lupa.svg" alt="">
              </div>
            <!--button (click)="actualizarLista(lista)" class="btn-editar">✏️ Guardar</button>-->
        </li>
        <li class="lista-añadir">
          +
        </li>
    </ul>

    </div>

     <!-- Barra lateral derecha -->
    <div class="sidebar right-sidebar">
      <div class="sidebar-content">
        <h4>Filtros Derecha</h4>
        <!-- Contenido de filtros derecha -->
      </div>
    </div>
  </div>
</div>

<li [class]="claseNivel">
  <div class="tarea">
    <div class="cabecera">
      <button 
        (click)="cambiarEstado()" 
        class="estado-boton" 
        [class]="claseEstado"
        [attr.aria-label]="'Estado actual: ' + estados[estadoActual]"
      ></button>
      
      <div class="nombre" (click)="toggleSubtareas()">
        {{ nombre }}
        <span *ngIf="progreso" class="badge-progreso">{{ progreso }}</span>
      </div>
      
      <div class="acciones-tarea">
        <button 
        #botonAgregar
        class="boton-agregar" 
        [class.girando]="girando"
        (click)="agregarSubtarea()" 
        (mousedown)="$event.button === 2 && onRightMouseDown()"
        (mouseup)="$event.button === 2 && onRightMouseUp()"
        (mouseleave)="girando = false"
        (contextmenu)="$event.preventDefault()"
        aria-label="Añadir subtarea"
        >+</button>
      </div>
    </div>
    
    <div *ngIf="subtareas.length > 0" class="subtareas" #subtareasContainer>
      <ul>
        <li *ngFor="let subtarea of subtareas; trackBy: trackByTarea; let i = index">
          <app-tarea
            [nombre]="subtarea.nombre"
            [subtareas]="subtarea.subtareas"
            [nivel]="nivel + 1"
            (eliminar)="eliminarSubtarea(i)"
          ></app-tarea>
        </li>
      </ul>
    </div>
  </div>
</li>

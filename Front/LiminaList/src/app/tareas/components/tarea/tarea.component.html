<li [class]="claseNivel">
  <div class="tarea">
    <div class="cabecera">
      <button 
        (click)="cambiarEstado()" 
        class="estado-boton" 
        [class]="claseEstado"
        [attr.aria-label]="'Estado actual: ' + estados[estadoActual]"
      ></button>
      
      <div class="contenedor-nombre">
        <!-- Elemento para mostrar el nombre y abrir el modo de edición -->
        <div 
          *ngIf="!editandoNombre" 
          class="nombre" 
          (click)="toggleSubtareas()" 
          (contextmenu)="comenzarEdicion($event)">
          {{ nombre }}
          <span *ngIf="progreso" class="badge-progreso">{{ progreso }}</span>
        </div>
      
        <!-- Mantén el input en el DOM pero ocúltalo con [hidden] -->
        <input
          #nombreInput
          type="text"
          class="nombre-input"
          [(ngModel)]="nombreTemporal"
          [hidden]="!editandoNombre" 
          (blur)="guardarNombre()"
          (keydown.enter)="guardarNombre()"
          (keydown.escape)="cancelarEdicion()" />
      </div>
      
      
      <div class="acciones-tarea">
        <button 
          class="boton-agregar" 
          [class.girando]="girando"
          (click)="agregarSubtarea()" 
          (mousedown)="onRightMouseDown($event)"
          (mouseup)="onRightMouseUp($event)"
          (mouseleave)="girando = false"
          aria-label="Añadir subtarea"
        >+</button>
      </div>
    </div>
    
    <div *ngIf="subtareas.length > 0" class="subtareas" #subtareasContainer [class.cerrado]="!mostrarSubtareas">
      <ul>
        <li *ngFor="let subtarea of subtareas; trackBy: trackByTarea; let i = index">
          <app-tarea
            [nombre]="subtarea.nombre"
            [subtareas]="subtarea.subtareas"
            [nivel]="nivel + 1"
            (eliminar)="eliminarSubtarea(i)"
          ></app-tarea>
        </li>
      </ul>
    </div>
  </div>
</li>


<ul>
  <li class="boton-agregar">
    <h2 *ngIf="!tipoTarea">Tareas Puntuales</h2>
    <h2 *ngIf="tipoTarea">Tareas Rutinarias</h2>
    <button (click)="(editar)?agregarTarea():toggleTipoTarea()">
      <a *ngIf="editar">+</a>
      <img [hidden]="editar" src="assets/icons/switch.svg">
    </button>
  </li>
  <li *ngIf="tareas.length>0">
    <ul>
      <li *ngFor="let tarea of tareasFiltradas">
      <app-tarea
        [id]="tarea.id"
        [title]="tarea.title"
        [subtareas]="tarea.subtareas"
        (eliminar)="eliminarTarea(tarea)"
        [editar]="editar"
        [listaid]="tarea.list_id"
        [rutinario]="tarea.rutinario"
      >
    </app-tarea>
    </ul>
  </li>
  <li class="sinTareas" *ngIf="tareas.length==0">
    <h2>No hay tareas en esta lista</h2>
    <p *ngIf="!editar"><img src="assets/icons/dedo.png" style="transform: scaleX(-1);" alt="->"> Pulsa <img src="assets/icons/square-pen-solid.svg"> para entrar en modo edicion y usa + para añadir tareas</p>
    <p *ngIf="editar"><img src="assets/icons/dedo.png" style="transform: scaleX(-1);" alt="->"> Pulsa + para añadir tareas</p>
  </li>
</ul>

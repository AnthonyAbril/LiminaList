<div class="ajustes-container">

  <img src="assets/icons/dedo.png"  class="icono" (click)="irAInicio()" alt="home">
  <h1>Ajustes de usuario</h1>

  <!-- 👤 Datos del usuario -->
  <section>
    <h2>Nombre: {{ nombreUsuario }}</h2>
    <input [(ngModel)]="nuevoNombre" placeholder="Nuevo nombre" />
    <button (click)="cambiarNombre()">Cambiar nombre</button>
  </section>

  <!-- 🔐 Cambiar contraseña -->
  <section>
    <h2>Cambiar contraseña</h2>
    <input [(ngModel)]="nuevaPass" type="password" placeholder="Nueva contraseña" />
    <button (click)="cambiarPassword()">Guardar</button>
  </section>

  <!-- ☯️ Modo claro/oscuro -->
  <section>
    <h2>Modo de color</h2>
    <label>
      <input type="checkbox" [(ngModel)]="modoOscuro" (change)="alternarModo()" />
      Modo oscuro
    </label>
  </section>

  
  <section>
      <label>
          <input type="checkbox" [(ngModel)]="modoOscuroAutomatico" (change)="onAutoModeToggle()" />
          Activar modo oscuro automáticamente
      </label>
      <div *ngIf="modoOscuroAutomatico" style="margin-left: 1em;">
      <label>
        Desde:
        <!-- Input readonly que abre el timepicker -->
        <input
          readonly
          class="inputHora"
          [value]="horaInicioAuto"
          (click)="pickerInicio.open()"
          placeholder="Selecciona hora inicio"
        />
        <!-- Timepicker para 'horaInicioAuto' -->
        <ngx-material-timepicker
          #pickerInicio
          [format]="24"
          [theme]="myTheme"
          appendTo="body"
          panelClass="mi-timepicker-al-frente"
          (timeSet)="onHoraInicioChange($event)"
        ></ngx-material-timepicker>
      </label>
      <label>
        Hasta:
        <!-- Input readonly que abre el timepicker -->
        <input
          readonly
          class="inputHora"
          [value]="horaFinAuto"
          (click)="pickerFin.open()"
          placeholder="Selecciona hora fin"
        />
        <!-- Timepicker para 'horaFinAuto' -->
        <ngx-material-timepicker
          #pickerFin
          [format]="24"
          [theme]="myTheme"
          appendTo="body"
          panelClass="mi-timepicker-al-frente"
          (timeSet)="onHoraFinChange($event)"
        ></ngx-material-timepicker>
      </label>
    </div>
  </section>



  <!-- 🎨 Selector de colores -->
  <section>
    <h2>Apariencia - {{ modoOscuro ? 'Oscuro' : 'Claro' }}</h2>
    <label *ngFor="let key of ['primario', 'secundario', 'terciario', 'texto']">
      Color {{ key }}:
      <input type="color" [value]="coloresActivos[key]" (input)="cambiarColor(key, $event)" />
    </label>
  </section>

  <!-- 📁 Selección de patrón -->
  <section>
    <h2>Patrones guardados</h2>
    <select [(ngModel)]="patronSeleccionado" (change)="cargarPatron()">
      <option *ngFor="let p of patronesDisponibles" [value]="p.id">{{ p.nombre }}</option>
    </select>
    <button (click)="guardarPatron()">Guardar patrón actual</button>
  </section>

  <!-- ⚠️ Eliminar cuenta -->
  <section>
    <h2>Eliminar cuenta</h2>
    <button (click)="eliminarCuenta()" style="color: red;">Eliminar permanentemente</button>
  </section>
</div>

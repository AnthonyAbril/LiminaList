<div class="container-fluid">
  <div class="sidebar left-sidebar" [class.left-collapsed]="leftCollapsed">
    <div class="sidebar-header">
      <h3 *ngIf="!leftCollapsed ">Filtros</h3>
      <button class="toggle-btn" (click)="toggleLeft()">
        {{ leftCollapsed  ? '☰' : '×' }}
      </button>
    </div>
    
    <div class="sidebar-content" *ngIf="!leftCollapsed ">
      
      <input 
        type="text" 
        [(ngModel)]="filtro" 
        placeholder=" Filtrar listas..." 
        (input)="filtrarListas()" 
        class="search-bar"
      />
      
      <div class="filter-section">
        <h5>Categorías</h5>
        <div class="form-check">
          <input class="form-check-input" type="checkbox">
          <label class="form-check-label">Categoría 1</label>
        </div>
        <!-- Repetir para otras categorías -->
      </div>
    </div>
  </div>

  <div class="main-content">
    
    <div class="listas-container">
      <!-- Tu contenido existente aquí -->

      <div class="listas-header">
        <h2>Listas</h2>
        <button>+</button>
        <button (click)="borrar = !borrar">
          <ng-container *ngIf="!borrar; else conLupa">-</ng-container>
          <ng-template #conLupa>
            <img src="assets/icons/lupa.svg" style="height: 70%;" alt="">
          </ng-template>
        </button>

      </div>
    
    <ul class="listas">
        <li *ngFor="let lista of listas" class="lista-item">
            
              <div class="lista-nombre">
                <h3>{{lista.name}}</h3>
              </div>
              
              <div class="opciones">
                <img src="assets/icons/qr.svg" style="height: 100%;" alt="codigo qr" *ngIf="lista.id == this.listaSeleccionada">
                <ng-container *ngIf="!borrar; else conLupa">-</ng-container>
                <ng-template #conLupa>
                  <img src="assets/icons/lupa.svg" style="height: 70%;" alt="">
                </ng-template>
                <ng-template #conQr>
                  <img src="assets/icons/lupa.svg" style="height: 70%;" alt="">
                </ng-template>
              </div>
            <!--button (click)="actualizarLista(lista)" class="btn-editar">✏️ Guardar</button>-->
        </li>
    </ul>

    </div>

     <!-- Barra lateral derecha -->
    <div class="sidebar right-sidebar">
      <div *ngIf="this.listaSeleccionada==null">
        <h4>Selecciona una lista</h4>
      </div>
      <div class="sidebar-content" *ngIf="this.listaSeleccionada!=null">
        <h2>Lista Individual de tony</h2>

      </div>
    </div>
  </div>
</div>

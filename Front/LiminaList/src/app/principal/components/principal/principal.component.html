<div class="container">
    <div class="lista-lateral">
        <h2>Eventos Proximos</h2>
        <div>
            <ul>
                <li>a</li>
                <li *ngFor="let tarea of tareas">
                    <app-tarea
                      [nombre]="tarea.nombre"
                      [subtareas]="tarea.subtareas"
                      (eliminar)="tareas.splice(tareas.indexOf(tarea), 1)"
                    >
                  </app-tarea>
            </ul>
        </div>
    </div>

    <div class="main">
        <h1 class="titulo">Liminalist</h1>
        <div class="header">
            <div class="nav">
                <a href="#">A</a>
                <img src="assets\icons\exit.svg" [routerLink]="'/'" alt="Icono de Pluma" class="icono">
                <a href="#">A</a>
                <a href="#">A</a>
            </div>
        </div>

        <div class="main-content">
            <div *ngIf="resumen=='calendar'" class="calendar-mini">
                <p>a</p>
            </div>
            <div *ngIf="resumen=='listas'" class="listas-mini">
                <div class="header-resum">
                    <h2>Listas</h2><a>Filtros: A-Z</a>
                </div>
                <div class="main-resum">

                    <ul class="">
                        <li><div class="main-resum-lupa"><img src="assets/icons/lupa.svg" alt=""></div><div>Lista numero uno</div></li>
                        <li><div class="main-resum-lupa"><img src="assets/icons/lupa.svg" alt=""></div><div>Lista numero dos</div></li>
                        <li><div class="main-resum-lupa"><img src="assets/icons/lupa.svg" alt=""></div><div>Lista numero tres</div></li>
                        <li><div class="main-resum-lupa"><img src="assets/icons/lupa.svg" alt=""></div><div>Lista numero cuatro</div></li>
                    </ul>

                </div>
                <div class="footer-resum"></div>
            </div>
        </div>
    </div>
</div>

<div class="container" [ngClass]="{ 'active': isActive }" id="container">
  <div class="form-container sign-up">
    <form (ngSubmit)="registrarse()">
      <h1>Crear cuenta</h1>
      <div class="social-icons">
        <a href="#" class="icon"><i class="fa-brands fa-google-plus-g"></i></a>
        <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#" class="icon"><i class="fa-brands fa-github"></i></a>
        <a href="#" class="icon"><i class="fa-brands fa-linkedin-in"></i></a>
      </div>
      <span>O usa tu correo electrónico para registrarte</span>
      <input type="text" placeholder="Nombre" [(ngModel)]="registro.nombre" name="name">
      <input type="email" placeholder="Correo electrónico" [(ngModel)]="registro.email" name="email">
      <input type="password" placeholder="Contraseña" [(ngModel)]="registro.password" name="password">
      <button type="submit">Registrarse</button>
    </form>
  </div>
  <div class="form-container sign-in">
    <form (ngSubmit)="iniciarSesion()">
      <h1>Iniciar sesión</h1>
      <div class="social-icons">
        <a href="#" class="icon"><i class="fa-brands fa-google-plus-g"></i></a>
        <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#" class="icon"><i class="fa-brands fa-github"></i></a>
        <a href="#" class="icon"><i class="fa-brands fa-linkedin-in"></i></a>
      </div>
      <span>O usa tu correo y contraseña</span>
      <input type="email" placeholder="Correo electrónico" [(ngModel)]="login.email" name="email">
      <input type="password" placeholder="Contraseña" [(ngModel)]="login.password" name="password">
      <a href="#">¿Olvidaste tu contraseña?</a>
      <button type="submit">Ingresar</button>
    </form>
  </div>
  <div class="toggle-container">
    <div class="toggle">
      <div class="toggle-panel toggle-left">
        <h1>¡Bienvenido de nuevo!</h1>
        <p>Ingresa tus datos para acceder a todas las funciones de LiminaList</p>
        <button (click)="toggleLogin()" id="login">Iniciar sesión</button>
      </div>
      <div class="toggle-panel toggle-right">
        <h1>¡Hola!</h1>
        <p>Regístrate para acceder a todas las funciones de LiminaList</p>
        <button (click)="toggleRegister()" id="register">Registrarse</button>
      </div>
    </div>
  </div>
</div>
